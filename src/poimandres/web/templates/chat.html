<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poimandres</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <main id="dialogo">
    <h1>Poimandres</h1>
    {% for t in turnos %}
      <p class="fala"><b>você:</b> {{ t.fala }}</p>
      <p class="revelacao"><b>Mestre:</b> {{ t.revelacao }}</p>
      {% if t.citacoes %}<p class="citacoes">▸ funda em {{ t.citacoes | join(", ") }}</p>{% endif %}
    {% endfor %}
  </main>
  <form id="forma">
    <input id="fala" name="fala" autocomplete="off" placeholder="fala…" autofocus>
  </form>
  <script>
    const dialogo = document.getElementById("dialogo");
    const forma = document.getElementById("forma");
    const campo = document.getElementById("fala");

    function p(cls, html) {
      const el = document.createElement("p");
      el.className = cls;
      el.innerHTML = html;
      dialogo.appendChild(el);
      el.scrollIntoView();
      return el;
    }
    function escapar(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    function liberar() { campo.disabled = false; campo.focus(); }

    forma.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fala = campo.value.trim();
      if (!fala) return;
      campo.value = "";
      campo.disabled = true;
      p("fala", "<b>você:</b> " + escapar(fala));
      const espera = p("espera", "⟡ o Mestre considera tua fala…");

      let turno_id;
      try {
        const r = await fetch("/perguntar", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({fala}),
        });
        ({turno_id} = await r.json());
      } catch (_) {
        espera.remove();
        p("erro", "⟡ <b>Mestre:</b> (a rede falhou no envio)");
        liberar();
        return;
      }

      const timer = setInterval(async () => {
        let s;
        try {
          s = await (await fetch("/turno/" + turno_id)).json();
        } catch (_) {
          return;  // blip transitório — segue pollando
        }
        if (s.estado === "considerando") return;
        clearInterval(timer);
        espera.remove();
        if (s.estado === "erro") {
          p("erro", "⟡ <b>Mestre:</b> (o limiar se turvou: " + escapar(s.msg) + ")");
        } else {
          // foi_limite (silêncio) cai aqui com citacoes/movimentos vazios → só o texto
          p("revelacao", "⟡ <b>Mestre:</b> " + escapar(s.texto));
          (s.citacoes || []).length && p("citacoes", "▸ funda em " + s.citacoes.map(escapar).join(", "));
          (s.movimentos || []).forEach(m => p("movimento", "→ " + escapar(m)));
        }
        liberar();
      }, 2000);
    });
  </script>
</body>
</html>
